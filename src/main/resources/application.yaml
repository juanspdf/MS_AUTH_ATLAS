# ============================================================
# MSAUTENTICACION - Microservicio de Autenticación ATLAS
# ============================================================

server:
  port: 8081
  servlet:
    context-path: /ms-autenticacion

# ============================================================
# SPRING DATASOURCE - PostgreSQL
# ============================================================
spring:
  application:
    name: msautenticacion

  datasource:
    url: jdbc:postgresql://localhost:5432/atlas_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: usr
    open-in-view: false

  flyway:
    schemas: usr
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ============================================================
  # SPRING MAIL - SMTP Configuration
  # ============================================================
  # Configurar con las credenciales de tu servidor SMTP.
  mail:
    host: ${MAIL_HOST:${SMTP_HOST:smtp-relay.brevo.com}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:ad621e001@smtp-brevo.com}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:xsmtpsib-0a7aedd9927283dfa78153cb0d1812fb66a3df8a7a0bb59f7b116bd0c40fec38-YQj6qyXZ0CUrtxUF}}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            protocols: TLSv1.2
            trust: "*"
          # Opcional: desabilitar validación SSL para desarrollo (NO usar en producción)
          # ssl.checkserveridentity: false

# ============================================================
# JWT CONFIGURATION
# ============================================================
jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 horas en milisegundos

# ============================================================
# SPRINGDOC / SWAGGER
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ============================================================
# ACTUATOR
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: msautenticacion
    description: Microservicio de Autenticación y Autorización - Sistema ATLAS
    version: 0.0.1-SNAPSHOT

# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    com.sistemasgaia.atlas.msautenticacion: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# ============================================================
# ATLAS - Configuración de la aplicación
# ============================================================
atlas:
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:4200}
  email:
    from: ${EMAIL_FROM:jd.pasquel45@gmail.com}
    from-name: ${EMAIL_FROM_NAME:Sistema ATLAS}
  activacion:
    token-expiration-hours: ${TOKEN_EXPIRATION_HOURS:24}
